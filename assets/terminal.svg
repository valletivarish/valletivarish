<svg width="780" height="310" viewBox="0 0 780 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .txt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
    .title { font-size: 11px; fill: #6e6e69; }
    .prompt { fill: #CDE64B; }
    .cmd { fill: #F2F2EF; clip-path: inset(0 100% 0 0); }
    .out { fill: #9a9a94; opacity: 0; }
    .ok { fill: #CDE64B; opacity: 0; }
    .t1 { animation: type 0.6s steps(7) 0.5s forwards; }
    .o1 { animation: show 0.01s linear 1.4s forwards; }
    .t2 { animation: type 1.0s steps(20) 2.0s forwards; }
    .o2 { animation: show 0.01s linear 3.3s forwards; }
    .t3 { animation: type 1.1s steps(26) 3.9s forwards; }
    .o3 { animation: show 0.01s linear 5.3s forwards; }
    .o4 { animation: show 0.01s linear 5.7s forwards; }
    .o5 { animation: show 0.01s linear 6.1s forwards; }
    .p6 { opacity: 0; animation: show 0.01s linear 6.7s forwards; }
    .cursor { fill: #CDE64B; opacity: 0; animation: show 0.01s linear 6.7s forwards, blink 1.1s steps(1) 6.7s infinite; }
    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 -2% 0 0); } }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect x="1" y="1" width="778" height="308" rx="12" fill="#0d0d0d" stroke="#242424" stroke-width="1"/>
  <path d="M1 13 C1 6.4 6.4 1 13 1 H767 C773.6 1 779 6.4 779 13 V36 H1 Z" fill="#141414"/>
  <line x1="1" y1="36" x2="779" y2="36" stroke="#242424" stroke-width="1"/>
  <circle cx="22" cy="19" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="19" r="6" fill="#FEBC2E"/>
  <circle cx="62" cy="19" r="6" fill="#28C840"/>
  <text x="390" y="23" text-anchor="middle" class="txt title">varish@production ~ zsh</text>

  <text x="24" y="68" class="txt prompt">$</text>
  <text x="40" y="68" class="txt cmd t1">whoami</text>
  <text x="24" y="92" class="txt out o1">varish valleti · java backend engineer</text>

  <text x="24" y="124" class="txt prompt">$</text>
  <text x="40" y="124" class="txt cmd t2">uptime --production</text>
  <text x="24" y="148" class="txt out o2">calm releases · green dashboards · fast apis</text>

  <text x="24" y="180" class="txt prompt">$</text>
  <text x="40" y="180" class="txt cmd t3">docker compose up buyzaar</text>
  <text x="24" y="204" class="txt out o3"><tspan class="ok" style="opacity:1">[kafka]</tspan> event bus connected</text>
  <text x="24" y="226" class="txt out o4"><tspan class="ok" style="opacity:1">[redis]</tspan> cache warm</text>
  <text x="24" y="248" class="txt out o5"><tspan class="ok" style="opacity:1">[mongo]</tspan> five services healthy</text>

  <text x="24" y="282" class="txt prompt p6">$</text>
  <rect x="42" y="270" width="9" height="16" class="cursor"/>
</svg>
