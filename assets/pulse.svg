<svg width="780" height="170" viewBox="0 0 780 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .txt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .label { font-size: 11px; fill: #6e6e69; letter-spacing: 1px; }
    .value { font-size: 13px; fill: #F2F2EF; }
    .spark { stroke: #CDE64B; stroke-width: 2; fill: none; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 2.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
    .area { fill: url(#fade); opacity: 0; animation: show 1s linear 2.4s forwards; }
    .dot { fill: #28C840; animation: pulse 2s ease-in-out infinite; }
    .halo { fill: #28C840; opacity: 0.25; animation: halo 2s ease-in-out infinite; }
    .bar { fill: #CDE64B; transform-origin: left center; transform: scaleX(0); }
    .b1 { animation: fill1 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards; }
    .b2 { animation: fill2 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards; }
    .b3 { animation: fill3 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes show { to { opacity: 0.18; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes halo { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.05; } }
    @keyframes fill1 { to { transform: scaleX(0.92); } }
    @keyframes fill2 { to { transform: scaleX(0.97); } }
    @keyframes fill3 { to { transform: scaleX(0.06); } }
  </style>

  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDE64B"/>
      <stop offset="1" stop-color="#CDE64B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="778" height="168" rx="12" fill="#0d0d0d" stroke="#242424" stroke-width="1"/>

  <circle cx="30" cy="30" r="9" class="halo"/>
  <circle cx="30" cy="30" r="4" class="dot"/>
  <text x="48" y="34" class="txt label">PRODUCTION PULSE · ALL SYSTEMS GREEN</text>

  <g>
    <line x1="24" y1="140" x2="470" y2="140" stroke="#1c1c1c" stroke-width="1"/>
    <line x1="24" y1="110" x2="470" y2="110" stroke="#161616" stroke-width="1"/>
    <line x1="24" y1="80" x2="470" y2="80" stroke="#161616" stroke-width="1"/>
    <path class="area" d="M24 140 L24 118 C60 112 84 96 116 100 C148 104 164 122 196 118 C228 114 244 84 276 80 C308 76 324 96 356 92 C388 88 404 62 436 58 L470 54 L470 140 Z"/>
    <path class="spark" pathLength="100" d="M24 118 C60 112 84 96 116 100 C148 104 164 122 196 118 C228 114 244 84 276 80 C308 76 324 96 356 92 C388 88 404 62 436 58 L470 54"/>
  </g>

  <g>
    <text x="510" y="66" class="txt label">CACHE HIT</text>
    <rect x="510" y="74" width="240" height="4" rx="2" fill="#1c1c1c"/>
    <rect x="510" y="74" width="240" height="4" rx="2" class="bar b1"/>

    <text x="510" y="104" class="txt label">TEST COVERAGE MOOD</text>
    <rect x="510" y="112" width="240" height="4" rx="2" fill="#1c1c1c"/>
    <rect x="510" y="112" width="240" height="4" rx="2" class="bar b2"/>

    <text x="510" y="142" class="txt label">PANIC LEVEL</text>
    <rect x="510" y="150" width="240" height="4" rx="2" fill="#1c1c1c"/>
    <rect x="510" y="150" width="240" height="4" rx="2" class="bar b3"/>
  </g>
</svg>
